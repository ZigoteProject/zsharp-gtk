name: Bug report
description: A package, a tool or the documentation does the wrong thing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A defect someone could exploit (safe code reaching memory it doesn't own, a program reaching the package's pointers) is reported privately, not here: see SECURITY.md.
  - type: textarea
    id: program
    attributes:
      label: The smallest program or steps that show it
      description: A whole program is best, with its zs.toml and the commands.
      render: fsharp
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The exact output or error message, as text. A picture for what a window shows.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: This repository's release or commit, and the output of `zs --version` and `pkg-config --modversion gtk4 libadwaita-1`.
      placeholder: 0.1.0, zs 0.7.1, GTK 4.22.5, libadwaita 1.9.4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: System
      description: The distribution, the architecture, and Wayland or X11.
      placeholder: Fedora 44, x86-64, Wayland
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The tree of values (Gtk, App, Cmd, Test)
        - The libraries' modules (Gtk4, Adw, Gio…)
        - Handles, Glue, Loop, types of a program's own
        - Signals
        - The generator and the tools
        - Building or installing
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of failure
      options:
        - A wrong result or a wrong window
        - A panic
        - A crash in C, a hang or a leak
        - It doesn't build
        - A library function is missing or has the wrong shape
        - Documentation
    validations:
      required: true
