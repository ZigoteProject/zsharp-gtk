name: Idea or request
description: Something the packages should do, or do differently
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A widget or an option for the tree of values is agreed here, by name and shape, before it's written.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were writing, and what got in the way. A program that shows it helps most.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Optional. How it would look in a program, and what GTK, gtk-rs or another toolkit does.
      render: fsharp
